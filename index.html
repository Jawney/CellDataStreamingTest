<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cell Data Logger</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Cell Data Logger</h1>

        <div class="status-card">
            <div class="status-item">
                <span class="status-label">Network</span>
                <span id="statusNet" class="status-value idle">Checking...</span>
            </div>
            <div class="status-item">
                <span class="status-label">Stream</span>
                <span id="statusStream" class="status-value idle">Idle</span>
            </div>
            <div class="status-item">
                <span class="status-label">GPS</span>
                <span id="statusGPS" class="status-value idle">Waiting...</span>
            </div>
        </div>

        <div class="controls">
            <button id="startBtn">Start Tracking</button>
            <button id="exportBtn">Export CSV</button>
            <button id="clearBtn">Clear All Logs</button>
            <button onclick="location.reload(true)" style="background: #ccc; color: #333; font-size: 0.8rem; padding: 5px;">Force Reload</button>
        </div>

        <div class="log-section">
            <h2>Recent Activity</h2>
            <div id="logEntries"></div>
        </div>

        <div style="text-align: center; margin-top: 20px; font-size: 0.7rem; color: #999;">
            Version: 1.0.6 (Cache Busted)
        </div>

        <!-- Hidden Media Elements for Keep-Awake & Monitoring -->
        <video id="keepAwakeVideo" muted loop playsinline class="hidden"></video>
        <audio id="streamAudio" crossorigin="anonymous" class="hidden"></audio>
    </div>

    <script>
        // Inject script with timestamp to bypass GitHub Pages / Safari cache
        const script = document.createElement('script');
        script.src = 'app.js?v=' + Date.now();
        document.body.appendChild(script);
    </script>
</body>
</html>
